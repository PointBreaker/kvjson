name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be a SemVer version such as v0.1.0"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          commit="$GITHUB_SHA"
          build_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          module="github.com/PointBreaker/kvjson"
          mkdir -p dist

          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            archive="kv_${version}_${os}_${arch}"
            package_dir="dist/${archive}"
            mkdir -p "$package_dir"

            ldflags="-s -w -X ${module}/internal/buildinfo.Version=${GITHUB_REF_NAME} -X ${module}/internal/buildinfo.Commit=${commit} -X ${module}/internal/buildinfo.Date=${build_date}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags="$ldflags" \
              -o "${package_dir}/kv" \
              ./cmd/kv

            cp README.md LICENSE "$package_dir/"
            tar -C "$package_dir" -czf "dist/${archive}.tar.gz" kv README.md LICENSE
            rm -rf "$package_dir"
          done

      - name: Create checksums
        working-directory: dist
        run: sha256sum kv_*.tar.gz > checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/kv_*.tar.gz \
            dist/checksums.txt \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
